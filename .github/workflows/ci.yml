name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.0'
        cache: true

    - name: Install C dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libcmocka-dev

    - name: Build
      run: make build

    - name: Run Tests
      run: make test

    - name: Lint Go code
      run: |
        # Only run if golangci-lint is available, or we can install it
        # For now, let's just run go fmt check
        cd components/autotune && go fmt ./...
        cd components/postprocess && go fmt ./...
        cd components/emd && go fmt ./...
