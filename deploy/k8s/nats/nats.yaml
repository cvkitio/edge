apiVersion: v1
kind: Namespace
metadata:
  name: cvkit
---
# NATS hub for cvkit.
#
# - In-cluster clients connect to nats://nats.cvkit:4222 without credentials and
#   land in the CVKIT account (no_auth_user). The client port is ClusterIP only.
# - Edge boxes (e.g. cvkit-edge-01, a Pi 5 + Hailo) connect as leaf nodes on
#   :7422 with the "leaf" user. Each edge box runs its own JetStream domain, so
#   events are stored on the box first and the hub's DETECT stream sources them
#   across when the link is up. See components/detect/README.md.
# - Secrets come from the nats-credentials Secret (admin-password,
#   leaf-password); they are never in this file. NATS only expands $VARS that
#   are unquoted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: cvkit
data:
  nats.conf: |
    server_name: cvkit-hub
    port: 4222
    http_port: 8222

    jetstream {
      domain: hub
      store_dir: /data
      max_memory_store: 256MB
      max_file_store: 10GB
    }

    accounts {
      $SYS { users = [{ user: admin, password: $NATS_ADMIN_PASSWORD }] }
      CVKIT {
        jetstream: enabled
        users = [{ user: cvkit }]
      }
    }
    no_auth_user: cvkit

    leafnodes {
      port: 7422
      authorization {
        user: leaf
        password: $NATS_LEAF_PASSWORD
        account: CVKIT
      }
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: cvkit
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
      annotations:
        # Bump to roll the pod after editing nats.conf.
        cvkit/config-rev: "2"
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - name: client
              containerPort: 4222
            - name: leafnodes
              containerPort: 7422
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nats
            - name: data
              mountPath: /data
          env:
            - name: NATS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-credentials
                  key: admin-password
            - name: NATS_LEAF_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-credentials
                  key: leaf-password
      volumes:
        - name: config
          configMap:
            name: nats-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: cvkit
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
    - name: monitor
      port: 8222
---
# Leaf-node listener for edge boxes. On k3s, servicelb publishes this on the
# node's LAN address (nas01: 10.3.0.33:7422). Authenticated by leaf-password.
apiVersion: v1
kind: Service
metadata:
  name: nats-leaf
  namespace: cvkit
spec:
  type: LoadBalancer
  selector:
    app: nats
  ports:
    - name: leafnodes
      port: 7422
      targetPort: leafnodes
